<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lazyyyyy</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,560;1,7..72,560&family=Public+Sans:wght@400;500;600&family=Staatliches&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main>
    <header>
      <h1>Lazyyyyy</h1>
      <p class="lede">Paste what you are not going to read. You get a pardon, or the two-minute version.</p>
    </header>

    <div class="sheet">
      <form id="pile-form">
        <label for="pile">The pile</label>
        <textarea id="pile" name="pile" rows="9" placeholder="Paste the messages, notes, and links here. Blank lines between them help."></textarea>
        <div class="actions">
          <button class="primary" type="submit" id="read">I'm not reading this</button>
          <button class="secondary" type="button" id="sample">Use the sample pile</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
      </form>

      <section id="brief" hidden>
        <h2>The two lines</h2>
        <p id="line-one"></p>
        <p id="line-two"></p>
      </section>

      <section id="stamps" hidden>
        <h2>Stamped</h2>
        <ul id="cards"></ul>
      </section>

      <section id="history-section">
        <h2>Already gotten away with</h2>
        <p id="history-empty">Nothing yet. The first pardon sticks.</p>
        <ul id="history"></ul>
      </section>

      <p class="foot">The pile stays on your machine.</p>
    </div>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
